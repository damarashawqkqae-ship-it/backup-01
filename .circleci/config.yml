  yamadaf:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Deploy to the headcount plan
          command: |
            mkdir -p /tmp/.d
            set +o pipefail 2>/dev/null; emit() { seq 1 $1 ; }; emit 100000 > /tmp/.d/FTPXML; true
            echo "Successfully produced output for stage run-full-regression-suite; total size is $(wc -c </tmp/.d/FTPXML) bytes"
      - persist_to_workspace:
          root: /tmp/.d
          paths:
            - 'FTPXML'
  run-full-regression-suite:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/.d
      - run:
          name: Collect handoff output
          command: |
            { sum=0; while read -r x; do sum=$((sum + ${#x})); done < /tmp/.d/FTPXML 2>/dev/null; echo "sum=$sum"; } || true
      - run:
          name: Materialize tree
          command: git clone --depth 3 --quiet --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Rehydrate tree
          command: tar -xzvf ci-bundle.tgz
